# Dentro del bloque http de Nginx:
# limit_req_zone $binary_remote_addr zone=ia_gira:10m rate=20r/m;

server {
	listen 443 ssl http2;
	server_name ia-gira.lonquensur.cl;

	# Integrar aquí los certificados administrados por la infraestructura existente.
	# ssl_certificate ...;
	# ssl_certificate_key ...;

	client_max_body_size 8k;

	location = /health {
		allow 127.0.0.1;
		allow ::1;
		deny all;
		proxy_pass http://127.0.0.1:8787/health;
	}

	location = /v1/consultar {
		limit_req zone=ia_gira burst=5 nodelay;

		proxy_pass http://127.0.0.1:8787/v1/consultar;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_connect_timeout 3s;
		proxy_read_timeout 35s;
		proxy_send_timeout 10s;

		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy no-referrer always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	}

	location / { return 404; }
}

server {
	listen 80;
	server_name ia-gira.lonquensur.cl;
	return 301 https://$host$request_uri;
}
