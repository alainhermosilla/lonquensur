name: Verificar sitio de la Gira

on:
  pull_request:
    paths:
      - 'gira-innovacion/**'
      - 'ia-gira/**'
      - '.github/workflows/gira-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gira-innovacion
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gira-innovacion/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Construir sitio
        run: npm run build

  probar-api:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir corpus de evaluación
        working-directory: gira-innovacion
        run: npm ci && npm run build
      - name: Probar recuperación y restricciones de red
        working-directory: ia-gira
        run: npm test
      - name: Ejecutar batería de evaluación
        working-directory: ia-gira
        run: npm run eval
